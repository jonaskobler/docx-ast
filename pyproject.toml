[project]
name = "docx-ast"
version = "0.1.0"
description = "A lossless Word (.docx / OOXML) <-> AST engine: read, edit, highlight, comment and make tracked-change edits to Word documents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jonas Kobler", email = "jkobler@gmx.at" }]
keywords = ["docx", "ooxml", "word", "ast", "tracked-changes"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "lxml",
    "diff-match-patch",
]

[project.urls]
Homepage = "https://github.com/jonaskobler/docx-ast"
Repository = "https://github.com/jonaskobler/docx-ast"

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docx_ast"]
